[tools]
go = "latest"
golangci-lint = "latest"
gotestsum = "latest"
fnox = "latest"

[vars]
PKGVERSION = '{{exec(command="git describe --tags --abbrev=8 --dirty --always --long")}}'
LDFLAGS = "{{ get_env(name='LDFLAGS',default='-w -s') }} -X 'main.Version={{vars.PKGVERSION}}'"
NOCGO = "remote exclude_graphdriver_btrfs btrfs_noversion exclude_graphdriver_devicemapper containers_image_openpgp"
releasedir = "./dist"
release_archs = "amd64 arm64"

[tasks.build]
depends = ["build-amd64", "build-arm64"]


[tasks.build-amd64]
depends = ["generate"]
description = "Build the project for amd64"
sources = ["go.mod", "go.sum", "go.work", "go.work.sum", "**/*.go"]
outputs = ["./bin/athanor-amd64"]
env = { GOOS = "linux", GOARCH = "amd64", CGO_ENABLED = 0 }
run = 'go build -tags "{{vars.NOCGO}}" -ldflags="{{vars.LDFLAGS}}" -o bin/athanor-amd64 ./cmd'

[tasks.build-arm64]
depends = ["generate"]
description = "Build the project for arm64"
sources = ["go.mod", "go.sum", "go.work", "go.work.sum", "**/*.go"]
outputs = ["./bin/athanor-amd64"]
env = { GOOS = "linux", GOARCH = "arm64", CGO_ENABLED = 0 }
run = 'go build -tags "{{vars.NOCGO}}" -ldflags="{{vars.LDFLAGS}}" -o bin/athanor-arm64 ./cmd'

[tasks.check]
depends = ["lint", "test"]
description = "Run linters and tests"

[tasks.generate]
description = "Run go:generate"
sources = ["go.mod", "go.sum", "go.work", "go.work.sum", "**/*.go"]
run = "go generate ./..."

[tasks.lint]
wait_for = ["test"]
description = "Run linters"
hide = true
sources = ["go.mod", "go.sum", "go.work", "go.work.sum", "**/*.go"]
run = "golangci-lint run"

[tasks.test]
description = "Run tests"
sources = ["go.mod", "go.sum", "go.work", "go.work.sum", "**/*.go"]
run = "gotestsum ./..."

[tasks.install]
depends = ["build"]
run = "cp ./bin/athanor-amd64 ~/.local/bin/"

[tasks.release-tar]
description = "generate release tarballs"
depends = ["build", "docs"]
usage = '''
  arg "[version]" help="Manually specify version being released"
'''
run = '''
  #!/usr/bin/env bash
  set -euo pipefail
  VERSION=${usage_version:-$(git describe --exact-match --tags --match 'v[0-9]*' HEAD 2>/dev/null || git rev-parse --abbrev-ref HEAD)}
  epoch=$(git log -1 --format=%ct HEAD)
  rm -rf {{vars.releasedir}} && mkdir -p {{vars.releasedir}}
  for arch in {{vars.release_archs}}; do
    tmpdir=$(mktemp -d)
    chmod 755 "$tmpdir"
    mkdir -p "$tmpdir"/bin "$tmpdir"/man/man1 "$tmpdir"/man/man5
    cp ./README.md "$tmpdir"/
    cp ./LICENSE "$tmpdir"/
    cp bin/athanor-$arch "$tmpdir"/bin/athanor
    tar --sort=name --mtime="@$epoch" --owner=0 --group=0 --numeric-owner \
      -cf - -C "$tmpdir" . | gzip -n > "{{vars.releasedir}}/athanor-$VERSION-$arch.tar.gz"
    rm -rf "$tmpdir"
  done
  git archive --format=tar.gz -o {{vars.releasedir}}/athanor-$VERSION-src.tar.gz --prefix="athanor-${VERSION#v}/" $VERSION
'''

[tasks.release-sign-tar]
tools.cosign = "latest"
description = "SHA checksums and cosign the release tarballs"
dir = "{{vars.releasedir}}"
run = '''
	#!/usr/bin/env bash
	set -euo pipefail
	sha256sum $(ls | grep -v -e '^SHA256SUMS' -e '\.asc$' -e '\.bundle$') > SHA256SUMS
	cosign sign-blob --yes --key env://COSIGN_PRIVATE_KEY --bundle SHA256SUMS.cosign.bundle SHA256SUMS
'''

[tasks.release-sign-image]
tools.cosign = "latest"
description = "Cosign image from digest file"
usage = '''
  arg "<digestfile>" help="Digest file path"
  arg "<repo>" help="Repo to sign at"
'''
run = '''
	#!/usr/bin/env bash
	set -euo pipefail
	digest=$(<"${usage_digestfile?}")
	cosign sign --yes --recursive --key env://COSIGN_PRIVATE_KEY "${usage_repo?}@$digest"
	cosign verify --key cosign.pub "${usage_repo?}@$digest" >/dev/null
'''


